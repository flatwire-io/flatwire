<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flatwire — benchmark dashboard</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
      --muted: #8b949e; --accent: #2f81f7; --mat: #6e7681; --stream: #3fb950;
      --stream2: #2f81f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 80px; }
    header h1 { font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -0.5px; }
    header p { color: var(--muted); margin: 0 0 4px; max-width: 720px; }
    .badges { margin: 14px 0 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 12px; font-size: 0.8rem; color: var(--muted); text-decoration: none;
    }
    .badge:hover { border-color: var(--accent); color: var(--text); }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px 22px; margin: 20px 0;
    }
    .card h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .card .sub { color: var(--muted); font-size: 0.86rem; margin: 0 0 16px; }
    .legend { display: flex; gap: 18px; font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 12px; margin: 9px 0; }
    .row .lang { font-size: 0.9rem; text-align: right; color: var(--text); }
    .bars { display: flex; flex-direction: column; gap: 5px; }
    .bar-track { position: relative; height: 20px; }
    .bar {
      height: 20px; border-radius: 4px; display: flex; align-items: center;
      min-width: 2px; transition: width .6s cubic-bezier(.2,.7,.2,1);
      white-space: nowrap;
    }
    .bar .lbl { font-size: 0.72rem; padding: 0 7px; color: #fff; font-variant-numeric: tabular-nums; }
    .bar .lbl.out { color: var(--muted); padding-left: 6px; }
    .foot { color: var(--muted); font-size: 0.8rem; margin-top: 14px; }
    .tag { font-size: 0.68rem; color: var(--muted); }
    .toggle { display:flex; gap:8px; margin: 6px 0 18px; }
    .toggle button {
      background: var(--panel); color: var(--muted); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem;
    }
    .toggle button.active { color: #fff; border-color: var(--accent); background: #132a4d; }
    footer { color: var(--muted); font-size: 0.82rem; margin-top: 30px; text-align:center; }
    .loading { color: var(--muted); padding: 40px 0; text-align:center; }
  </style>
</head>
<body>
  <div id="root"><div class="wrap"><p class="loading">Loading benchmark data…</p></div></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    // ---- helpers ----------------------------------------------------------
    function humanBytes(n) {
      if (n === 0) return "0 B";
      const u = ["B", "KB", "MB", "GB"];
      let v = n, i = 0;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return (i === 0 ? v.toFixed(0) : v.toFixed(1)) + " " + u[i];
    }
    function humanSec(n) { return n < 0.001 ? (n * 1e6).toFixed(0) + " µs" : n.toFixed(3) + " s"; }

    const COLORS = { materialized: "#6e7681", streaming: "#3fb950", dom: "#6e7681", stream2: "#2f81f7" };

    function Bar({ value, max, color, label, fmt }) {
      const pct = max > 0 ? Math.max(0.4, (value / max) * 100) : 0;
      const wide = pct > 22;
      return (
        <div className="bar-track">
          <div className="bar" style={{ width: pct + "%", background: color }}>
            {wide && <span className="lbl">{fmt(value)}</span>}
          </div>
          {!wide && <span className="lbl out" style={{ position: "absolute", left: `calc(${pct}% + 6px)`, top: 2 }}>{fmt(value)}</span>}
        </div>
      );
    }

    function ComparisonCard({ title, sub, rows, keys, colors, fmt, foot }) {
      const max = Math.max(...rows.flatMap(r => keys.map(k => r[k] || 0)));
      return (
        <div className="card">
          <h2>{title}</h2>
          <p className="sub">{sub}</p>
          <div className="legend">
            {keys.map((k, i) => (
              <span key={k}><span className="swatch" style={{ background: colors[i] }}></span>{k}</span>
            ))}
          </div>
          {rows.map((r, idx) => (
            <div className="row" key={idx}>
              <div className="lang">{r.lang || r.size}{r.metric && <div className="tag">{r.metric}</div>}</div>
              <div className="bars">
                {keys.map((k, i) => (
                  <Bar key={k} value={r[k] || 0} max={max} color={colors[i]} fmt={fmt} />
                ))}
              </div>
            </div>
          ))}
          {foot && <p className="foot">{foot}</p>}
        </div>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);

      useEffect(() => {
        fetch("./data.json").then(r => r.json()).then(setData).catch(e => setErr(String(e)));
      }, []);

      if (err) return <div className="wrap"><p className="loading">Could not load data.json ({err}).</p></div>;
      if (!data) return <div className="wrap"><p className="loading">Loading benchmark data…</p></div>;

      return (
        <div className="wrap">
          <header>
            <h1>flatwire benchmarks</h1>
            <p>Streaming JSON &amp; XML serialization that keeps <strong>memory flat</strong> and <strong>time linear</strong>. Real numbers, measured on the dev machine and CI runners — payload: <strong>{data.meta.payloadLabel}</strong>.</p>
            <div className="badges">
              <a className="badge" href="./playground.html">🔬 Protocol playground</a>
              <a className="badge" href="https://github.com/flatwire-io/flatwire">GitHub</a>
              <a className="badge" href="https://pypi.org/project/flatwire/">PyPI</a>
              <a className="badge" href="https://www.npmjs.com/package/flatwire">npm</a>
              <a className="badge" href="https://www.nuget.org/packages/FlatWire">NuGet</a>
              <a className="badge" href="https://crates.io/crates/flatwire">crates.io</a>
            </div>
          </header>

          {data.conformance && (
            <div className="card" style={{ borderColor: "#238636", background: "linear-gradient(180deg,#0f2417,#161b22)" }}>
              <h2>Proven identical across six languages</h2>
              <p className="sub">{data.conformance.note}</p>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "8px", margin: "6px 0 14px" }}>
                {data.conformance.languages.map((l) => (
                  <span key={l} className="badge" style={{ borderColor: "#238636", color: "#e6edf3" }}>{l}</span>
                ))}
              </div>
              <div className="row">
                <div className="lang">round-trip</div>
                <div style={{ color: "var(--stream)" }}>✓ {data.conformance.roundtrip}</div>
              </div>
              <div className="row">
                <div className="lang">MessagePack</div>
                <div style={{ color: data.conformance.msgpackByteIdentical ? "var(--stream)" : "var(--muted)" }}>
                  {data.conformance.msgpackByteIdentical ? "✓ byte-identical across all six languages" : "round-trips"}
                </div>
              </div>
              <p className="foot">
                <a href={data.conformance.matrixUrl}>See the full round-trip + byte-identity matrix →</a>
              </p>
            </div>
          )}

          {data.ttfb && (
            <ComparisonCard
              title="Time-to-first-row — the latency buyers feel"
              sub={data.ttfb.note}
              rows={data.ttfb.rows}
              keys={["materialized", "streaming"]}
              colors={[COLORS.materialized, COLORS.stream2]}
              fmt={(v) => v + " ms"}
              foot="Materialize-then-parse must receive the whole response before it can hand over row 0, so its TTFB scales with payload size; streaming stays ~constant near 1 ms. At 10k rows that's 490 ms → 0.9 ms." />
          )}

          {data.concurrencyMem && (
            <ComparisonCard
              title="Memory under concurrency — why p99 stops cliff-diving"
              sub={data.concurrencyMem.note}
              rows={data.concurrencyMem.rows}
              keys={["materialized", "streaming"]}
              colors={[COLORS.materialized, COLORS.streaming]}
              fmt={humanBytes}
              foot="Each materialized request holds a full copy, so memory grows ~linearly with concurrency; streaming holds one element per request. At 32 concurrent decodes, ~65× less memory — the difference between surviving a spike and OOMing." />
          )}

          <ComparisonCard
            title="Encode memory — materialized vs streaming"
            sub={data.encodeMemory.note}
            rows={data.encodeMemory.rows}
            keys={["materialized", "streaming"]}
            colors={[COLORS.materialized, COLORS.streaming]}
            fmt={humanBytes}
            foot="Streaming encode writes each element straight to the output, so peak memory is bounded by one element regardless of collection size — a clean win in every language." />

          <ComparisonCard
            title="Decode memory — materialized vs streaming"
            sub={data.decodeMemory.note}
            rows={data.decodeMemory.rows}
            keys={["materialized", "streaming"]}
            colors={[COLORS.materialized, COLORS.streaming]}
            fmt={humanBytes}
            foot="Cleanest with precise allocators (Python tracemalloc, Rust tracking allocator); GC runtimes (Go/Java) show the win under real memory pressure rather than in a micro-benchmark." />

          <ComparisonCard
            title="Decode time — the trade-off"
            sub={data.decodeTime.note}
            rows={data.decodeTime.rows}
            keys={["materialized", "streaming"]}
            colors={[COLORS.materialized, COLORS.stream2]}
            fmt={humanSec}
            foot="flatwire trades CPU time for flat memory. The cost is small (or even negative) in native runtimes; large in pure-Python." />

          <ComparisonCard
            title="Streaming XML — DOM vs flatwire (Python)"
            sub={data.xml.note}
            rows={data.xml.rows}
            keys={["dom", "streaming"]}
            colors={[COLORS.dom, COLORS.streaming]}
            fmt={humanBytes}
            foot="Parsing a 12 MB XML document with ElementTree peaks at ~125 MB; flatwire streaming holds ~4 MB — a ~97% reduction. Streaming, flat-memory XML for large collections is a rare capability." />

          {data.msgpack && (
            <ComparisonCard
              title="Binary MessagePack — bytes on the wire vs JSON (Python)"
              sub={data.msgpack.note}
              rows={data.msgpack.rows}
              keys={["json", "msgpack"]}
              colors={[COLORS.materialized, COLORS.stream2]}
              fmt={humanBytes}
              foot="flatwire's streaming MessagePack is wire-compatible with the reference library, ~11–13% smaller than JSON on this string-heavy shape (more on numeric data) — with the same flat-memory streaming." />
          )}

          <footer>
            Numbers are reproducible from the repo — see <code>packages/*/bench/</code> and <code>docs/BENCHMARKS.md</code>. Apache-2.0.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
