name: Release

# Trigger by pushing a tag like v0.1.0.
# Each job publishes one ecosystem's package to its canonical registry.
# Secrets required (set in repo settings, except PyPI which uses OIDC):
#   PyPI  -> none (Trusted Publishing / OIDC; configure the publisher on PyPI first)
#   npm   -> uses provenance + OIDC-less NODE_AUTH_TOKEN secret NPM_TOKEN
#   NuGet -> NUGET_API_KEY
#   crates.io -> CARGO_REGISTRY_TOKEN
#   Maven Central -> OSSRH_USERNAME, OSSRH_PASSWORD, MAVEN_GPG_KEY, MAVEN_GPG_PASSPHRASE
#   Go    -> nothing to publish; the tag itself is the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # PyPI Trusted Publishing
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  npm:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # npm provenance
    defaults:
      run:
        working-directory: packages/js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nuget:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/dotnet/FlatWire
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet pack -c Release -o out
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  crates:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  maven:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Requires signing + OSSRH publishing config in build.gradle before this
      # will push to Maven Central. Until then this job builds the artifacts.
      - run: gradle build --no-daemon

