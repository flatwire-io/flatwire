[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatwire"
version = "0.8.0"
description = "Streaming JSON serialization that keeps memory flat and time linear - stream large collections element-by-element."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "The flatwire authors" }]
keywords = ["json", "serialization", "streaming", "memory", "performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/flatwire-io/flatwire"
Source = "https://github.com/flatwire-io/flatwire"
Issues = "https://github.com/flatwire-io/flatwire/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["flatwire"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


