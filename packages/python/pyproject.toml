[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatwire"
version = "1.1.0"
description = "Streaming JSON serialization that keeps memory flat and time linear - stream large collections element-by-element."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Parag Sawant" }]
keywords = ["json", "serialization", "streaming", "memory", "performance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/flatwire-io/flatwire"
Source = "https://github.com/flatwire-io/flatwire"
Issues = "https://github.com/flatwire-io/flatwire/issues"

[project.scripts]
flatwire = "flatwire.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# `pip install flatwire[fast]` adds the orjson C extension; when present,
# streaming JSON encode uses it automatically (~7x faster). Purely optional -
# the default install has zero dependencies and streaming decode is already fast
# on the standard library alone.
fast = ["orjson>=3"]

[tool.setuptools]
packages = ["flatwire"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


