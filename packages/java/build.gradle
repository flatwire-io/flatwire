plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.29.0'
}

group = 'io.github.flatwire-io'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Separate 'bench' source set so the benchmark (which uses com.sun.management)
// is compiled and runnable but never packaged into the published library jar.
sourceSets {
    bench {
        java {
            srcDir 'src/bench/java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    benchImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    useJUnitPlatform()
}

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Run the flatwire vs Jackson benchmark'
    classpath = sourceSets.bench.runtimeClasspath
    mainClass = 'io.flatwire.Benchmark'
}

import com.vanniktech.maven.publish.SonatypeHost

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()

    coordinates('io.github.flatwire-io', 'flatwire', '1.0.0')

    pom {
        name = 'flatwire'
        description = 'Streaming JSON serialization that keeps memory flat and time linear - stream large collections element-by-element.'
        url = 'https://github.com/flatwire-io/flatwire'
        licenses {
            license {
                name = 'Apache-2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0'
            }
        }
        developers {
            developer {
                id = 'flatwire-io'
                name = 'Parag Sawant'
                url = 'https://github.com/flatwire-io'
            }
        }
        scm {
            url = 'https://github.com/flatwire-io/flatwire'
            connection = 'scm:git:https://github.com/flatwire-io/flatwire.git'
            developerConnection = 'scm:git:ssh://git@github.com/flatwire-io/flatwire.git'
        }
    }
}





