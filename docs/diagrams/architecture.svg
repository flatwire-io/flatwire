<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1600" height="980" fill="#fbfcfe"/><text x="800.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">flatwire - streaming serialization: memory flat, time linear</text><text x="800.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One tiny API streams a big collection element-by-element: four wire formats, six languages, byte-identical binaries proven in CI.</text><rect x="48" y="150" width="300" height="362" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">YOUR APP</text><rect x="68" y="196" width="260" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,211) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="114" y="227" font-size="16.5" font-weight="700" fill="#136b74">Large collection</text><text x="85" y="249.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">100k homogeneous records</text><text x="85" y="266.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">never materialized whole</text><rect x="68" y="411" width="260" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,426) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="114" y="442" font-size="16.5" font-weight="700" fill="#136b74">Row consumer</text><text x="85" y="464.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">iterates one row at a time</text><text x="85" y="481.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">peak stays flat under load</text><rect x="392" y="150" width="500" height="364" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="410" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#17509f">ONE STREAMING ENGINE - MEMORY FLAT, TIME LINEAR</text><rect x="414" y="186" width="476" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(430,201) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></g><text x="460" y="217" font-size="16.5" font-weight="700" fill="#17509f">encode_array(items, out)</text><text x="431" y="239.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">writes elements one at a time</text><text x="431" y="256.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">peak ~ largest element, not N</text><rect x="414" y="298" width="476" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(430,313) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v4a4 4 0 0 0 4 4h8"/><path d="M6 21v-4a4 4 0 0 1 4-4h8"/><path d="M15 8l3 3-3 3"/><path d="M15 14l3 3-3 3"/></g><text x="460" y="329" font-size="16.5" font-weight="700" fill="#17509f">format codec</text><text x="431" y="351.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">json / xml / msgpack / cbor</text><text x="431" y="368.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">JSON default = stdlib bytes; binary is canonical</text><rect x="414" y="410" width="476" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(430,425) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.6 6H14a4 4 0 0 1 0 8H9a4 4 0 0 0 0 8h.5"/></g><text x="460" y="441" font-size="16.5" font-weight="700" fill="#17509f">decode_array(in) -&gt; rows</text><text x="431" y="463.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">lazy stdlib streaming parser</text><text x="431" y="480.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">yields one row; ~200 KB flat</text><rect x="966" y="250" width="200" height="118" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1054.0,264) scale(1.0000)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/></g><text x="1066.0" y="308" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3d4a63">The wire</text><text x="1066.0" y="329.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">plain byte stream</text><text x="1066.0" y="346.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">transport-agnostic</text><rect x="1300" y="150" width="252" height="372" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="1318" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">FOUR WIRE SHAPES</text><rect x="1320" y="194" width="212" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,209) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="1366" y="225" font-size="16.5" font-weight="700" fill="#186547">JSON</text><text x="1337" y="247.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">[ e0, e1, ... ]</text><text x="1337" y="264.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">depth-1 comma split</text><rect x="1320" y="300" width="212" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,315) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="1366" y="331" font-size="16.5" font-weight="700" fill="#186547">XML</text><text x="1337" y="353.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">&lt;items&gt;&lt;item&gt;...&lt;/item&gt;</text><text x="1337" y="370.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">boundary = each child</text><rect x="1320" y="406" width="212" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,421) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="1366" y="437" font-size="16.5" font-weight="700" fill="#186547">MsgPack, CBOR</text><text x="1337" y="459.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">native array, canonical</text><text x="1337" y="476.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">compact ints, sorted keys</text><rect x="392" y="556" width="384" height="176" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(572.0,570) scale(1.0000)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/></g><text x="584.0" y="614" text-anchor="middle" font-size="16.5" font-weight="700" fill="#9e2b36">Checked streams</text><text x="584.0" y="635.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">envelope: items[] then a status flag</text><text x="584.0" y="652.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the terminal flag is written LAST</text><text x="584.0" y="670.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">clean vs producer-error vs truncation</text><rect x="812" y="556" width="432" height="176" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1016.0,570) scale(1.0000)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="1028.0" y="614" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8c5a0d">Conformance in CI</text><text x="1028.0" y="635.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">one corpus -&gt; Python, Node, .NET, Rust, Go, Java</text><text x="1028.0" y="652.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">encode -&gt; decode round-trip in all six</text><text x="1028.0" y="670.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">+ SHA-256 byte-identity on every push</text><path d="M328,238 L414,229" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="346.024" y="221.5" width="49.952" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="371.0" y="237.94" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">items</text><path d="M652,272 L652,298" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M890,335 L966,320" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="896.4" y="315.5" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="928.0" y="331.94" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">encode</text><path d="M1166,300 L1300,236" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="1204.424" y="256.0" width="57.152" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="1233.0" y="272.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">one of</text><path d="M1066,368 L1066.0,438.0 Q1066,453 1051.0,453.0 L890,453" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="1034.4" y="403.0" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="1066" y="419.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">decode</text><path d="M414,453 L330,453" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><rect x="338.312" y="441.0" width="67.376" height="24.0" rx="12" fill="#ffffff" stroke="#2aa5b0" stroke-opacity="0.4"/><text x="372.0" y="457.44" text-anchor="middle" font-size="12" font-weight="600" fill="#136b74">one row</text><path d="M600,496 L600,556" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)" stroke-dasharray="7 5"/><rect x="540.5360000000001" y="514.0" width="118.928" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="600.0" y="530.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">checked variant</text><path d="M852,496 L852,556" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)" stroke-dasharray="7 5"/><rect x="807.512" y="514.0" width="88.976" height="24.0" rx="12" fill="#ffffff" stroke="#e0a13a" stroke-opacity="0.4"/><text x="852.0" y="530.44" text-anchor="middle" font-size="12" font-weight="600" fill="#8c5a0d">every push</text><rect x="48" y="788" width="742" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="812" font-size="13.2" font-weight="700" fill="#186547">Byte-identical across six languages</text><text x="64" y="834" font-size="12.4" fill="#186547" fill-opacity="0.92">The identical tier - null, booleans, canonical-minimal integers, ASCII</text><text x="64" y="852.4" font-size="12.4" fill="#186547" fill-opacity="0.92">strings, arrays, fixed-key objects, nesting - encodes to the same bytes</text><text x="64" y="870.8" font-size="12.4" fill="#186547" fill-opacity="0.92">in all six. MessagePack and CBOR sort map keys and use IEEE-754 floats.</text><rect x="812" y="788" width="740" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="828" y="812" font-size="13.2" font-weight="700" fill="#8c5a0d">The roundtrip tier, and non-goals</text><text x="828" y="834" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Float text (1e10 -&gt; 10000000000.0 vs 10000000000), JSON escapes,</text><text x="828" y="852.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">integers past 2^53 (no JS number) and map-key order legitimately vary -</text><text x="828" y="870.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">round-trip only. Pure data layer; Protobuf / Avro deferred (need a schema).</text><text x="800.0" y="962" text-anchor="middle" font-size="12" fill="#6b7794">flatwire-io/flatwire</text></svg>